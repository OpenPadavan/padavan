name: Build Brand New Ridoy.Net Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install build dependencies & ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake bison build-essential flex gawk gettext \
          git gperf libtool pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev \
          texinfo python3-docutils autopoint cpio unzip zip wget curl imagemagick

      - name: Clone Padavan-ng source
        run: |
          git clone --depth 1 https://gitlab.com/hadzhioglu/padavan-ng.git padavan-ng

      - name: Build Toolchain
        working-directory: padavan-ng/toolchain
        run: |
          ./build_toolchain.sh

      - name: Generate & Apply Ridoy.Net Custom Branding
        run: |
          WWW_DIR="padavan-ng/trunk/user/www/n56u_ribbon_fixed"
          
          # 1. Generate Transparent White "Ridoy.Net" Logo (180x45)
          convert -size 180x45 xc:none -font DejaVu-Sans-Bold -pointsize 26 \
          -fill white -gravity west -annotate +5+0 "Ridoy.Net" \
          "$WWW_DIR/images/logo.png"

          # 2. Change Browser Tab Title & Brand Name
          sed -i 's/Web_Title=.*/Web_Title=Ridoy.Net Wireless Router/g' "$WWW_DIR/EN.dict"
          
          # 3. Customize Footer Copyright to Ridoy.Net
          sed -i 's/Ridoy & N56U Project Community/Ridoy.Net Custom Firmware/g' "$WWW_DIR/state.js"
          sed -i 's/Ridoy.*/Ridoy.Net/g' "$WWW_DIR/state.js"

          # 4. Set Default Wi-Fi SSID & Hostname to Ridoy.Net
          DEF_FILE="padavan-ng/trunk/user/shared/defaults.h"
          sed -i 's/#define DEF_WLAN_2G_SSID.*/#define DEF_WLAN_2G_SSID "Ridoy.Net"/g' "$DEF_FILE"
          sed -i 's/#define DEF_HOST_NAME.*/#define DEF_HOST_NAME "Ridoy.Net"/g' "$DEF_FILE"

      - name: Configure and Build for TL-WR845N v4
        working-directory: padavan-ng/trunk
        run: |
          cp configs/templates/TL-WR845N-V4.config .config
          ./clear_tree.sh
          ./build_firmware.sh

      - name: Upload Ridoy.Net Firmware (.trx)
        uses: actions/upload-artifact@v4
        with:
          name: RidoyNet-TL-WR845N-v4-Firmware
          path: padavan-ng/trunk/images/*.trx
