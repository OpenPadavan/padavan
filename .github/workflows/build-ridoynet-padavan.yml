      - name: Generate & Apply Ridoy.Net Custom Branding
        run: |
          WWW_DIR="padavan-ng/trunk/user/www/n56u_ribbon_fixed"
          
          # 1. Replace CSS SVG Logo with Pure Text "Ridoy.Net"
          cat << 'EOF' >> "$WWW_DIR/bootstrap/css/main.css"
          
          /* Custom Ridoy.Net Logo Override */
          .logo, #logo {
            background-image: none !important;
            background: none !important;
            width: auto !important;
            height: auto !important;
          }
          .logo::after, #logo::after {
            content: "Ridoy.Net";
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            display: inline-block;
            padding: 8px 12px;
          }
          EOF

          # 2. Replace all occurrences of PADAVAN in HTML, JS, and Dictionary files
          find "$WWW_DIR" -type f \( -name "*.asp" -o -name "*.js" -o -name "*.dict" \) -exec sed -i 's/PADAVAN/Ridoy.Net/g' {} +
          find "$WWW_DIR" -type f \( -name "*.asp" -o -name "*.js" -o -name "*.dict" \) -exec sed -i 's/Padavan/Ridoy.Net/g' {} +

          # 3. Set Default Wi-Fi SSID & Hostname to Ridoy.Net
          DEF_FILE="padavan-ng/trunk/user/shared/defaults.h"
          sed -i 's/#define DEF_WLAN_2G_SSID.*/#define DEF_WLAN_2G_SSID "Ridoy.Net"/g' "$DEF_FILE"
          sed -i 's/#define DEF_HOST_NAME.*/#define DEF_HOST_NAME "Ridoy.Net"/g' "$DEF_FILE"
