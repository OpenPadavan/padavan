name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      boards:
        description: 'Router(s) to build, comma-separated (ex: xiaomi/mi-3,phicomm/psg1218) or "all" for every board'
        required: true
        type: string
      config:
        description: 'Optional config overrides, one CONFIG_* line per line (appended to the board template)'
        required: false
        type: string

env:
  IMAGE_NAME: padavan-build

permissions:
  contents: read

jobs:
  validate:
    name: Validate board configs
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate templates map to board dirs
        run: |
          set -euo pipefail
          errors=0
          while IFS= read -r tpl; do
            rel="${tpl#trunk/configs/templates/}"
            VENDOR=$(grep -E '^CONFIG_VENDOR=' "$tpl" | head -1 | cut -d= -f2)
            PID=$(grep -E '^CONFIG_FIRMWARE_PRODUCT_ID=' "$tpl" | head -1 | cut -d= -f2 | tr -d '"')
            if [ -z "$VENDOR" ] || [ -z "$PID" ]; then
              echo "::error file=$tpl::missing CONFIG_VENDOR or CONFIG_FIRMWARE_PRODUCT_ID"
              errors=$((errors+1))
              continue
            fi
            if [ ! -d "trunk/configs/boards/$VENDOR/$PID" ]; then
              echo "::error file=$tpl::no matching dir trunk/configs/boards/$VENDOR/$PID"
              errors=$((errors+1))
            fi
          done < <(find trunk/configs/templates -name '*.config')
          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors template(s) without a matching board dir"
            exit 1
          fi
          echo "All $(( $(find trunk/configs/templates -name '*.config' | wc -l) )) templates validated OK"

  resolve-boards:
    name: Resolve board list
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch'
    outputs:
      boards: ${{ steps.resolve.outputs.boards }}
      config: ${{ steps.resolve.outputs.config }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate boards and config overrides
        id: resolve
        env:
          REQUESTED_BOARDS: ${{ inputs.boards }}
          CUSTOM_CONFIG: ${{ inputs.config }}
        run: |
          set -euo pipefail

          if [ -z "$REQUESTED_BOARDS" ]; then
            echo "::error::boards input is required"
            exit 1
          fi

          if [ "$REQUESTED_BOARDS" = "all" ]; then
            BOARDS=$(find trunk/configs/templates -name '*.config' \
                     | sed -e 's#^trunk/configs/templates/##' -e 's#\.config$##' \
                     | sort)
          else
            BOARDS=""
            IFS=',' read -ra ARR <<< "$REQUESTED_BOARDS"
            for b in "${ARR[@]}"; do
              b="${b//[[:space:]]/}"
              [ -n "$b" ] || continue
              if [[ ! "$b" =~ ^[A-Za-z0-9_/-]+$ ]]; then
                echo "::error::invalid board format '$b' (allowed: letters, digits, _ / -)"
                exit 1
              fi
              tpl="trunk/configs/templates/$b.config"
              if [ -f "$tpl" ]; then
                VENDOR=$(grep -E '^CONFIG_VENDOR=' "$tpl" | head -1 | cut -d= -f2)
                PID=$(grep -E '^CONFIG_FIRMWARE_PRODUCT_ID=' "$tpl" | head -1 | cut -d= -f2 | tr -d '"')
                if [ -z "$VENDOR" ] || [ -z "$PID" ] || [ ! -d "trunk/configs/boards/$VENDOR/$PID" ]; then
                  echo "::error::board '$b' has no matching board dir (vendor=$VENDOR pid=$PID)"
                  exit 1
                fi
                BOARDS="${BOARDS}${b}"$'\n'
              else
                echo "::error::unknown board '$b'. Run the workflow with boards=all to see the full list."
                exit 1
              fi
            done
          fi

          JSON=$(printf '%s\n' "$BOARDS" | sed '/^$/d' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "boards=$JSON" >> "$GITHUB_OUTPUT"
          echo "Resolved boards: $(printf '%s\n' "$BOARDS" | sed '/^$/d' | tr '\n' ' ')"

          if [ -n "$CUSTOM_CONFIG" ]; then
            # allow only blank lines, comments and CONFIG_*= assignments
            INVALID=0
            while IFS= read -r line; do
              case "$line" in
                ''|'#'*|' '*|'	'*) ;;
                CONFIG_[A-Za-z0-9_]*=*) ;;
                *)
                  echo "::error::invalid config line: '$line'"
                  INVALID=1
                  ;;
              esac
            done <<< "$CUSTOM_CONFIG"
            if [ "$INVALID" -ne 0 ]; then
              echo "::error::config contains invalid lines (only CONFIG_*= assignments, comments and blank lines allowed)"
              exit 1
            fi
            echo "config<<CFGEOF" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$CUSTOM_CONFIG" >> "$GITHUB_OUTPUT"
            echo "CFGEOF" >> "$GITHUB_OUTPUT"
          fi

  build-image:
    name: Build container image
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t "$IMAGE_NAME" -f Dockerfile .

      - name: Push image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME"
          docker tag "$IMAGE_NAME" "$IMG:latest"
          docker push "$IMG:latest"

  build-toolchain:
    name: Build cross toolchain
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          echo "[$(date -u '+%H:%M:%S')] apt-get update"
          sudo apt-get update
          echo "[$(date -u '+%H:%M:%S')] installing build dependencies"
          sudo apt-get install -y autoconf autoconf-archive automake autopoint bison build-essential ca-certificates cmake cpio curl dos2unix doxygen fakeroot flex gawk gettext git gperf help2man kmod libarchive-tools libblkid-dev libc-ares-dev libcurl4-openssl-dev libdevmapper-dev libev-dev libevent-dev libexif-dev libflac-dev libgmp3-dev libid3tag0-dev libidn2-dev libjpeg-dev libkeyutils-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libogg-dev libsqlite3-dev libssl-dev libsystemd-dev libtool libtool-bin libudev-dev libunbound-dev libvorbis-dev libxml2-dev locales pkg-config ppp-dev python3 python3-docutils texinfo unzip uuid uuid-dev wget xxd zlib1g-dev
          echo "[$(date -u '+%H:%M:%S')] dependencies installed"

      - name: Compute toolchain cache key
        id: toolchain-key
        run: |
          SHA=$(find toolchain -type f -not -path 'toolchain/dl/*' -not -path 'toolchain/out/*' -print0 \
                | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-40)
          echo "key=toolchain-${{ runner.os }}-$SHA" >> "$GITHUB_OUTPUT"

      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            toolchain/out
            toolchain/dl
          key: ${{ steps.toolchain-key.outputs.key }}
          restore-keys: |
            toolchain-${{ runner.os }}-

      - name: Build toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        working-directory: toolchain
        run: |
          echo "[$(date -u '+%H:%M:%S')] building cross toolchain (no cache hit)"
          ./build_toolchain.sh
          echo "[$(date -u '+%H:%M:%S')] toolchain build done"

  build-firmware:
    name: Build firmware (${{ matrix.board }})
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: write
    needs: [resolve-boards, build-toolchain]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        board: ${{ fromJson(needs.resolve-boards.outputs.boards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set board env
        run: |
          BOARD="${{ matrix.board }}"
          echo "BOARD=$BOARD" >> $GITHUB_ENV
          echo "SLUG=${BOARD//\//-}" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          echo "[$(date -u '+%H:%M:%S')] apt-get update"
          sudo apt-get update
          echo "[$(date -u '+%H:%M:%S')] installing build dependencies"
          sudo apt-get install -y autoconf autoconf-archive automake autopoint bison build-essential ca-certificates cmake cpio curl dos2unix doxygen fakeroot flex gawk gettext git gperf help2man kmod libarchive-tools libblkid-dev libc-ares-dev libcurl4-openssl-dev libdevmapper-dev libev-dev libevent-dev libexif-dev libflac-dev libgmp3-dev libid3tag0-dev libidn2-dev libjpeg-dev libkeyutils-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libogg-dev libsqlite3-dev libssl-dev libsystemd-dev libtool libtool-bin libudev-dev libunbound-dev libvorbis-dev libxml2-dev locales pkg-config ppp-dev python3 python3-docutils texinfo unzip uuid uuid-dev wget xxd zlib1g-dev
          echo "[$(date -u '+%H:%M:%S')] dependencies installed"

      - name: Compute toolchain cache key
        id: toolchain-key
        run: |
          SHA=$(find toolchain -type f -not -path 'toolchain/dl/*' -not -path 'toolchain/out/*' -print0 \
                | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-40)
          echo "key=toolchain-${{ runner.os }}-$SHA" >> "$GITHUB_OUTPUT"

      - name: Restore toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: |
            toolchain/out
            toolchain/dl
          key: ${{ steps.toolchain-key.outputs.key }}
          restore-keys: |
            toolchain-${{ runner.os }}-

      - name: Select board configuration
        working-directory: trunk
        run: cp "configs/templates/$BOARD.config" .config

      - name: Apply custom configuration
        if: needs.resolve-boards.outputs.config != ''
        working-directory: trunk
        env:
          CUSTOM_CONFIG: ${{ needs.resolve-boards.outputs.config }}
        run: |
          printf '%s\n' "$CUSTOM_CONFIG" >> .config
          echo "[$(date -u '+%H:%M:%S')] custom config overrides applied:"
          printf '%s\n' "$CUSTOM_CONFIG"

      - name: Download source tarballs (strongswan)
        working-directory: trunk
        run: |
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_SSWAN=y' ".config"; then
            echo "[$(date -u '+%H:%M:%S')] board needs strongswan; downloading"
            make -C user/strongswan download_test
          else
            echo "board does not use strongswan; skipping download"
          fi

      - name: Build firmware
        working-directory: trunk
        run: |
          echo "[$(date -u '+%H:%M:%S')] firmware build started"
          ./build_firmware.sh
          echo "[$(date -u '+%H:%M:%S')] firmware build done"

      - name: Verify firmware
        run: |
          set -euo pipefail
          images=()
          for img in trunk/images/*; do
            [ -e "$img" ] || continue
            images+=("$img")
            size=$(stat -c %s "$img")
            echo "[$(date -u '+%H:%M:%S')] $img : $size bytes ($(file -b "$img"))"
            if [ "$size" -lt 500000 ]; then
              echo "::error file=$img::firmware image suspiciously small (${size} bytes)"
              exit 1
            fi
          done
          if [ "${#images[@]}" -eq 0 ]; then
            echo "::error::no firmware images produced"
            exit 1
          fi
          echo "## Firmware build summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for img in "${images[@]}"; do
            echo "- $(basename "$img") \`$(sha256sum "$img" | cut -c1-16)…\`" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload firmware images
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.SLUG }}
          path: trunk/images/*
          retention-days: 30
          if-no-files-found: error
