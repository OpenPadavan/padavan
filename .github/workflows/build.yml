env:
  IMAGE_NAME: padavan-build
  DEFAULT_BOARD: xiaomi/mi-r3pro

jobs:
  build-image:
    name: Build container image
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t "$IMAGE_NAME" -f Dockerfile .

      - name: Push image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME"
          docker tag "$IMAGE_NAME" "$IMG:latest"
          docker push "$IMG:latest"

  resolve-boards:
    name: Resolve board list
    runs-on: ubuntu-22.04
    outputs:
      boards: ${{ steps.resolve.outputs.boards }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve board list
        id: resolve
        run: |
          REQUESTED="${{ inputs.board }}"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "Push: building default board ${{ env.DEFAULT_BOARD }}"
            echo "boards=[\"${{ env.DEFAULT_BOARD }}\"]" >> "$GITHUB_OUTPUT"
          elif [[ -z "$REQUESTED" || "$REQUESTED" == "all" ]]; then
            echo "Building all supported boards"
            BOARDS=$(find trunk/configs/templates -name '*.config' | \
                     sed -e 's#^trunk/configs/templates/##' -e 's#\.config$##' | \
                     sort)
            JSON=$(printf '%s\n' "$BOARDS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "boards=$JSON" >> "$GITHUB_OUTPUT"
          else
            echo "Building single board: $REQUESTED"
            echo "boards=[\"$REQUESTED\"]" >> "$GITHUB_OUTPUT"
          fi

  build-toolchain:
    name: Build cross toolchain
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          echo "[$(date -u '+%H:%M:%S')] apt-get update"
          sudo apt-get update
          echo "[$(date -u '+%H:%M:%S')] installing build dependencies"
          sudo apt-get install -y autoconf autoconf-archive automake autopoint bison build-essential ca-certificates cmake cpio curl dos2unix doxygen fakeroot flex gawk gettext git gperf help2man kmod libarchive-tools libblkid-dev libc-ares-dev libcurl4-openssl-dev libdevmapper-dev libev-dev libevent-dev libexif-dev libflac-dev libgmp3-dev libid3tag0-dev libidn2-dev libjpeg-dev libkeyutils-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libogg-dev libsqlite3-dev libssl-dev libsystemd-dev libtool libtool-bin libudev-dev libunbound-dev libvorbis-dev libxml2-dev locales pkg-config ppp-dev python3 python3-docutils texinfo unzip uuid uuid-dev wget xxd zlib1g-dev
          echo "[$(date -u '+%H:%M:%S')] dependencies installed"

      - name: Compute toolchain cache key
        id: toolchain-key
        run: |
          SHA=$(find toolchain -type f -not -path 'toolchain/dl/*' -not -path 'toolchain/out/*' -print0 \
                | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-40)
          echo "key=toolchain-${{ runner.os }}-$SHA" >> "$GITHUB_OUTPUT"

      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            toolchain/out
            toolchain/dl
          key: ${{ steps.toolchain-key.outputs.key }}
          restore-keys: |
            toolchain-${{ runner.os }}-

      - name: Build toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        working-directory: toolchain
        run: |
          echo "[$(date -u '+%H:%M:%S')] building cross toolchain (no cache hit)"
          ./build_toolchain.sh
          echo "[$(date -u '+%H:%M:%S')] toolchain build done"

  build-firmware:
    name: Build firmware (${{ matrix.board }})
    runs-on: ubuntu-22.04
    needs: [resolve-boards, build-toolchain]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        board: ${{ fromJson(needs.resolve-boards.outputs.boards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set board env
        run: |
          BOARD="${{ matrix.board }}"
          echo "BOARD=$BOARD" >> $GITHUB_ENV
          echo "SLUG=${BOARD//\//-}" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          echo "[$(date -u '+%H:%M:%S')] apt-get update"
          sudo apt-get update
          echo "[$(date -u '+%H:%M:%S')] installing build dependencies"
          sudo apt-get install -y autoconf autoconf-archive automake autopoint bison build-essential ca-certificates cmake cpio curl dos2unix doxygen fakeroot flex gawk gettext git gperf help2man kmod libarchive-tools libblkid-dev libc-ares-dev libcurl4-openssl-dev libdevmapper-dev libev-dev libevent-dev libexif-dev libflac-dev libgmp3-dev libid3tag0-dev libidn2-dev libjpeg-dev libkeyutils-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libogg-dev libsqlite3-dev libssl-dev libsystemd-dev libtool libtool-bin libudev-dev libunbound-dev libvorbis-dev libxml2-dev locales pkg-config ppp-dev python3 python3-docutils texinfo unzip uuid uuid-dev wget xxd zlib1g-dev
          echo "[$(date -u '+%H:%M:%S')] dependencies installed"

      - name: Compute toolchain cache key
        id: toolchain-key
        run: |
          SHA=$(find toolchain -type f -not -path 'toolchain/dl/*' -not -path 'toolchain/out/*' -print0 \
                | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-40)
          echo "key=toolchain-${{ runner.os }}-$SHA" >> "$GITHUB_OUTPUT"

      - name: Restore toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: |
            toolchain/out
            toolchain/dl
          key: ${{ steps.toolchain-key.outputs.key }}
          restore-keys: |
            toolchain-${{ runner.os }}-

      - name: Select board configuration
        working-directory: trunk
        run: cp "configs/templates/$BOARD.config" .config

      - name: Download source tarballs (strongswan)
        working-directory: trunk
        run: |
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_SSWAN=y' ".config"; then
            echo "[$(date -u '+%H:%M:%S')] board needs strongswan; downloading"
            make -C user/strongswan download_test
          else
            echo "board does not use strongswan; skipping download"
          fi

      - name: Build firmware
        working-directory: trunk
        run: |
          echo "[$(date -u '+%H:%M:%S')] firmware build started"
          ./build_firmware.sh
          echo "[$(date -u '+%H:%M:%S')] firmware build done"

      - name: Verify firmware
        run: |
          set -euo pipefail
          images=()
          for img in trunk/images/*; do
            [ -e "$img" ] || continue
            images+=("$img")
            size=$(stat -c %s "$img")
            echo "[$(date -u '+%H:%M:%S')] $img : $size bytes ($(file -b "$img"))"
            if [ "$size" -lt 500000 ]; then
              echo "::error file=$img::firmware image suspiciously small (${size} bytes)"
              exit 1
            fi
          done
          if [ "${#images[@]}" -eq 0 ]; then
            echo "::error::no firmware images produced"
            exit 1
          fi
          echo "## Firmware build summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for img in "${images[@]}"; do
            echo "- $(basename "$img") \`$(sha256sum "$img" | cut -c1-16)…\`" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload firmware images
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.SLUG }}
          path: trunk/images/*
          retention-days: 30
          if-no-files-found: error
